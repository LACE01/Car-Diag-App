<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="description" content="Garage — vehicle diagnostic and maintenance companion. Offline-first, VIN-accurate, standards-conformant.">
<title>Garage — vehicle diagnostic &amp; maintenance</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236C5CE7'/%3E%3Cpath d='M18.4 5.5a3.9 3.9 0 0 1-4.8 4.8l-5.3 5.3a1.5 1.5 0 1 1-2.1-2.1l5.3-5.3a3.9 3.9 0 0 1 4.8-4.8l-2.1 2.1.6 2.1 2.1.6z' fill='none' stroke='%23fff' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="toast"></div>

<!-- ============ AUTH ============ -->
<div id="auth"></div>

<!-- ============ APP ============ -->
<div id="app" class="hide">

  <div class="scrim mscrim" onclick="menu(false)"></div>
  <div class="scrim iscrim" onclick="closeInsp()"></div>

  <div class="app">
    <nav class="nav">
      <div class="brand"><div class="mark" id="brandmark"></div><b>GARAGE</b></div>
      <select class="vsel hide" id="navveh" aria-label="Active vehicle"></select>
      <a href="#garage"     data-go="garage"      data-ic="garage"    class="on">My garage</a>
      <a href="#vehicle"    data-go="vehicle"     data-ic="wrench">Vehicle health</a>
      <a href="#maintenance" data-go="maintenance" data-ic="bell">Maintenance</a>
      <a href="#diagnose"   data-go="diagnose"    data-ic="dlc">Diagnose</a>
      <a href="#systems"    data-go="systems"     data-ic="schematic">Systems &amp; diagrams</a>
      <a href="#money"      data-go="money"       data-ic="money">Fuel &amp; money</a>
      <a href="#ownership"  data-go="ownership"   data-ic="shield">Ownership &amp; docs</a>
      <a href="#wear"       data-go="wear"        data-ic="tire">Tires, brakes, battery</a>
      <a href="#parts"      data-go="parts"       data-ic="hex">Find parts</a>
      <a href="#records"    data-go="records"     data-ic="clipboard">Records &amp; reports</a>
      <div class="spacer"></div>
      <div class="foot">
        <span class="pill" id="netpill"><span class="dot"></span> Checking…</span>
        <div class="toggles">
          <button id="t-gm" onclick="togglePref('garagemode')">Garage mode</button>
          <button id="t-dark" onclick="togglePref('dark')">Dark</button>
          <button id="t-metric" onclick="togglePref('metric')">Metric</button>
        </div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <button class="burger" onclick="menu(true)" id="burgerbtn" aria-label="Menu"></button>
        <div class="title" id="ttl">My Garage</div>
        <div class="avatar" onclick="accountSheet()" title="Account">··</div>
      </header>

      <div class="page">
        <section class="screen on" id="s-garage">
          <div class="between wrap" style="margin-bottom:18px">
            <div>
              <h2 style="font-size:25px">My garage</h2>
              <p class="note" style="margin:4px 0 0" id="garagesub">No vehicles yet</p>
            </div>
            <button class="btn sm" onclick="openAdd()">+ Add vehicle</button>
          </div>
          <div class="grid g3" id="veh-grid"></div>
          <div id="alerts"></div>
        </section>

        <section class="screen" id="s-vehicle"></section>
        <section class="screen" id="s-maintenance"></section>
        <section class="screen" id="s-diagnose"></section>

        <section class="screen" id="s-systems">
          <p class="note" style="margin:0 0 16px" id="sysvehicle"></p>
          <div class="grid g4" style="gap:14px" id="sysgrid"></div>
          <div class="between wrap" style="margin:30px 0 14px">
            <h3 style="font-size:19px" id="dgtitle"></h3>
            <button class="btn xs ghost" onclick="symbolLegend()">Symbol legend</button>
          </div>
          <div class="viewer">
            <div class="vbar" id="layerbar"></div>
            <div class="canvas" id="canvas"></div>
            <div class="keylist" id="keylist"></div>
            <div style="padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap" id="refchips"></div>
          </div>
          <p class="note" style="margin-top:12px" id="dgfoot"></p>
        </section>

        <section class="screen" id="s-money"></section>
        <section class="screen" id="s-ownership"></section>
        <section class="screen" id="s-wear"></section>
        <section class="screen" id="s-parts"></section>
        <section class="screen" id="s-records"></section>
      </div>
    </div>
  </div>

  <aside class="drawer">
    <div class="dhead">
      <div class="between">
        <div style="min-width:0">
          <span class="mlabel" id="i-sys">Component</span>
          <h3 style="font-size:20px" id="i-name">—</h3>
        </div>
        <button onclick="closeInsp()" style="font-size:24px;color:var(--muted);flex:0 0 auto">&times;</button>
      </div>
      <div class="tabs" id="i-tabs"></div>
    </div>
    <div class="dbody" id="i-body"></div>
  </aside>

  <div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
</div>

<script src="/js/icons.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/kb.js"></script>
<script src="/js/obd.js"></script>
<script src="/js/app.js"></script>
<script src="/js/screens.js"></script>
<script src="/js/diagrams.js"></script>
<script src="/js/diagnose.js"></script>
</body>
</html>
